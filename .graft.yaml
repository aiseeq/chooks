schema: 1
graft: '>=2.37.0'
version:
  mode: git-tag
gate:
  - task: smoke
  # glint падает кодом выхода на любой находке: fail_on: low в .glint.yaml.
  - sh: GOWORK=off ~/bin/glint check .

tools:
  glint:
    go_install: github.com/aiseeq/glint/cmd/glint
    check: [glint, rules]
    expect: fail-open

tasks:
  build:
    desc: собрать бинарь в bin/
    run:
      - [go, build, -ldflags, '-X main.Version=${GRAFT_VERSION}', -o, bin/chooks, ./cmd/chooks]
  install:
    desc: установить бинарь в ~/bin и конфигурацию в ~/.config/chooks
    deps: [build]
    run:
      # Замена через переименование: прямая перезапись падает с "Text file busy",
      # пока работает фоновый процесс уведомления
      - sh: |
          set -eu
          dir="$HOME/bin"
          config="${XDG_CONFIG_HOME:-$HOME/.config}/chooks/config.yaml"
          mkdir -p "$dir" "$(dirname "$config")" "$HOME/.claude/logs"
          cp bin/chooks "$dir/chooks.new"
          mv -f "$dir/chooks.new" "$dir/chooks"
          # Существующую конфигурацию не трогаем и шаблон рядом не кладём:
          # копия .new устаревала и путала, какие хуки включены
          if [ -f "$config" ]; then
            echo "Конфигурация сохранена: существующий $config не изменён"
            if ! diff -q "$config" configs/hooks.yaml >/dev/null; then
              echo "Отличия от шаблона configs/hooks.yaml (- установленный, + шаблон):"
              diff -u "$config" configs/hooks.yaml || true
            fi
          else
            cp configs/hooks.yaml "$config"
            echo "Конфигурация создана: $config"
          fi
          echo "Бинарь установлен: $dir/chooks"
          echo ""
          echo "Добавь блок hooks из configs/settings-snippet.json в ~/.claude/settings.json"
  uninstall:
    desc: удалить установленный бинарь (конфигурация остаётся)
    run:
      - sh: |
          set -eu
          rm -f "$HOME/bin/chooks"
          echo "Удалён $HOME/bin/chooks (конфигурация оставлена)"
  test:
    desc: тесты
    usage: <флаги go test, например -run TestX>
    run: ['go test {args} ./...']
  test-race:
    desc: тесты с детектором гонок
    run: [go test -race ./...]
  cover:
    desc: покрытие тестами
    run:
      - go test -coverprofile=coverage.out ./...
      - sh: go tool cover -func=coverage.out | tail -1
  fmt:
    desc: отформатировать код
    run: [gofmt -w .]
  lint:
    desc: go vet и golangci-lint, если установлен
    run:
      - go vet ./...
      - sh: |
          if command -v golangci-lint >/dev/null 2>&1; then
            golangci-lint run
          else
            echo "golangci-lint не установлен, выполнен только go vet"
          fi
  glint:
    desc: проверить код glint
    run: [glint check .]
  clean:
    desc: удалить артефакты сборки
    run: [rm -rf bin coverage.out]
  smoke:
    desc: гейт коммита, сборка и тесты
    run:
      - go build ./...
      - go test ./...

# go fix -diff ./... после go vet: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true
