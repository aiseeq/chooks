schema: 1
graft: '>=2.37.0'
version:
  mode: git-tag
gate:
  - task: smoke
  # glint падает кодом выхода на находках high и выше (fail_on по умолчанию).
  - task: glint

staticcheck: {enabled: true}

tools:
  glint:
    go_install: github.com/aiseeq/glint/cmd/glint
    check: [glint, rules]
    expect: fail-open

tasks:
  build:
    desc: собрать бинари в bin/ - chooks и прокси хуков chooks-hook
    run:
      - [go, build, -ldflags, '-X main.Version=${GRAFT_VERSION}', -o, bin/chooks, ./cmd/chooks]
      - [go, build, -o, bin/chooks-hook, ./cmd/chooks-hook]
  install:
    desc: установить chooks и chooks-hook в ~/bin, unit-файлы демона в ~/.config/systemd/user (не включая) и конфигурацию в ~/.config/chooks
    deps: [build]
    run:
      - {install: bin/chooks}
      - {install: bin/chooks-hook}
      - sh: |
          set -eu
          # Unit-файлы демона хуков: только кладутся. Включение и запуск
          # (systemctl --user enable --now chooks.socket) - отдельный шаг
          # (тикет hooks-daemon, этап 2б-3); запущенный демон после замены
          # ~/bin/chooks выходит сам, и systemd поднимает новый
          units="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
          mkdir -p "$units"
          for unit in chooks.socket chooks.service; do
            if cmp -s "configs/systemd/$unit" "$units/$unit"; then
              continue
            fi
            install -m 0644 "configs/systemd/$unit" "$units/$unit.new"
            mv -f "$units/$unit.new" "$units/$unit"
            echo "Unit обновлён: $units/$unit (systemctl --user daemon-reload, если демон включён)"
          done
      - sh: |
          set -eu
          config="${XDG_CONFIG_HOME:-$HOME/.config}/chooks/config.yaml"
          mkdir -p "$(dirname "$config")" "$HOME/.claude/logs"
          # Существующую конфигурацию не трогаем и шаблон рядом не кладём:
          # копия .new устаревала и путала, какие хуки включены
          if [ -f "$config" ]; then
            echo "Конфигурация сохранена: существующий $config не изменён"
            if ! diff -q "$config" configs/hooks.yaml >/dev/null; then
              echo "Отличия от шаблона configs/hooks.yaml (- установленный, + шаблон):"
              diff -u "$config" configs/hooks.yaml || true
            fi
          else
            cp configs/hooks.yaml "$config"
            echo "Конфигурация создана: $config"
          fi
          echo ""
          echo "Добавь блок hooks из configs/settings-snippet.json в ~/.claude/settings.json"
  uninstall:
    desc: удалить установленный бинарь (конфигурация остаётся)
    run:
      - sh: |
          set -eu
          rm -f "$HOME/bin/chooks" "$HOME/bin/chooks-hook"
          echo "Удалены $HOME/bin/chooks и $HOME/bin/chooks-hook (конфигурация и unit-файлы оставлены)"
  test:
    desc: тесты
    usage: <флаги go test, например -run TestX>
    tests: go
    run: ['go test -json {args} ./...']
  test-race:
    desc: тесты с детектором гонок
    run: [go test -race ./...]
  cover:
    desc: покрытие тестами
    run:
      - go test -coverprofile=coverage.out ./...
      - sh: go tool cover -func=coverage.out | tail -1
  fmt:
    desc: отформатировать код
    run: [gofmt -w .]
  lint:
    desc: go vet и golangci-lint, если установлен
    run:
      - go vet ./...
      - sh: |
          if command -v golangci-lint >/dev/null 2>&1; then
            golangci-lint run --allow-serial-runners
          else
            echo "golangci-lint не установлен, выполнен только go vet"
          fi
  glint:
    desc: проверить код glint
    # heavy + remote: при занятом ноуте graft отправляет шаг на pc;
    # вывод на pc и ноуте совпадает побайтно (сверка 02.11, тикет glint-gate-remote)
    heavy: true
    remote: true
    env: {GOWORK: "off"}
    run: [glint check .]
  clean:
    desc: удалить артефакты сборки
    run: [rm -rf bin coverage.out]
  smoke:
    desc: гейт коммита, сборка и тесты
    tests: go
    # Без remote: go test здесь идёт из кеша 0–1 с, на PC с холодным кешем
    # 9–14 с; ожидание гейта - допуск местных шагов (graft-master 31.10)
    run:
      - go build ./...
      - go test -json ./...

# go fix -diff ./... после go vet: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true
