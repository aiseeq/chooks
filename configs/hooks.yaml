# Конфигурация chooks

logger:
  level: "info" # debug, info, warn, error
  format: "text" # text, json
  output: "file" # stdout, stderr, file
  file: "~/.claude/logs/chooks.log"
  max_size_mb: 16 # ротация лога при превышении размера, 0 — отключить

tools:
  # Блокирует отправку комментария в Jira с маркерами агентского стиля
  # (длинное тире, markdown, «», «X, а не Y», приветствие, числа прописью) —
  # текст обязан пройти через скилл write-as-user
  jira_style:
    enabled: true

  # Блокирует kill/pkill/killall, цель которых вычисляется при запуске ($p, $(…), xargs)
  # или задевает сессию: PID 1, kill -1, kill 0, группа процессов, systemd и графическая оболочка, предки claude,
  # оболочка самой команды (pkill -f по шаблону, совпадающему с текстом команды)
  kill_guard:
    enabled: true

  # Кладёт агенту diff правки SKILL.md, CLAUDE.md или AGENTS.md, сделанной после того,
  # как текст попал ему в контекст; diff больше 2 КБ — изменённые разделы целиком
  # до 8 КБ, сверх — просьба перечитать с перечнем разделов (UserPromptSubmit,
  # PostToolBatch). Без ключа включено
  skill_reload:
    enabled: true

  # Проверка понимания перед письмом другой сессии (SendMessage) и правкой файла
  # инструкций (Edit, Write, Bash с sub, sed -i, tee, перенаправлением):
  # судья-модель сверяет действие с репликой пользователя, на расхождение — один
  # отказ, повтор того же вызова проходит (PreToolUse, подкоманда
  # understand-check); журнал —
  # ~/.local/state/chooks/understand-check.jsonl. Включает регистрация подкоманды
  # в settings.json; без ключа включено
  understand_check:
    enabled: true

  # Судья claim-check (luna/high, промпт v3) ищет утверждения о фактах без
  # проверки: ответ в конце хода (Stop, подкоманда claim-stop) и письмо
  # SendMessage (вместе с understand-check). Флаг — агенту проверить или
  # ответить, чем проверено; сбой судьи ход не держит. Журнал —
  # ~/.local/state/chooks/claim-check.jsonl. Без ключа включено
  claim_check:
    enabled: true
    # учётки codex (CODEX_HOME) по порядку: без кредитов — метка на час,
    # вызов на следующую
    codex_homes: [~/.codex, ~/.codex-personal]

  # На отказ сайта в ответе WebFetch (403, 429, страница проверки) подставляет
  # текст страницы из утилиты akit webtext (PostToolUse, подкоманда
  # webfetch-fallback), на упавший WebFetch добавляет его контекстом
  # (PostToolUseFailure). Включает регистрация подкоманды в settings.json; без
  # ключа включено
  webfetch_fallback:
    enabled: true

  # Ночью при заблокированном экране (22:00–09:00, LockedHint сессии seat0)
  # кладёт агенту подсказку: пользователь спит, вопрос — тикетом админу пространства
  # (SessionStart раз за ночь; UserPromptSubmit — на каждом ходе, пока не вызван
  # скилл autonomous-work, по записи skill_reload; PreToolUse AskUserQuestion,
  # Stop с ❓; подкоманда night-hint). Включает регистрация подкоманды в
  # settings.json; без ключа включено
  night_hint:
    enabled: true

  # Суб-агентам Claude (не основной сессии) — отказ в git-командах, что стирают
  # незакоммиченную работу или меняют запушенное: reset --hard, restore,
  # checkout -- путь, clean, stash, force-push, удаление ветки на remote; в своём
  # linked worktree можно. Без ключа включено
  git_guard:
    enabled: true

  # Блокирует явный выбор модели, отсутствующей в ~/.config/models/approved
  model_guard:
    enabled: false
    # Проверять модель у claude, запущенного агентом; по умолчанию включено
    # runtime_launch_guard: false
    # имена из approved, которые запускает только пользователь: агенту
    # (Agent model, claude/cl --model, переменные модели, worker --model) — отказ
    # user_only: [fable]

  # Отклоняет rm/rmdir, на которые Claude Code сам спросит пользователя
  # («Dangerous rm operation on possibly-empty variable path», даже в bypass):
  # rm -f $S/*, "$1"/*, $X/tmp, rm -rf "$D" после D=$(pwd). Агент получает
  # переписанную форму rm -f "${S:?}"/* и запрос пользователю не всплывает.
  # То же для относительного глоба после cd («statically-unresolvable target»):
  # cd X && rm -f cl/* — агенту подсказка указать литеральный абсолютный путь
  rm_guard:
    enabled: true

  # Отклоняет rsync с --delete, если назначение зависит от переменной или подстановки
  # (например, rsync -a --delete src/ "$R"/); укажи литеральный абсолютный путь
  # или защити пустую переменную формой "${R:?}"/. Без ключа включено
  rsync_guard:
    enabled: true

  # Отклоняет запись файла через here-doc, тело которого Claude Code проверит
  # как команды и спросит пользователя: строка вида rm -rf $X/* в теле here-doc
  # внутри { … }, ( … ), if, for, case, функции или в команде длиннее 10000
  # символов. Агент получает подсказку создать файл инструментом Write
  write_guard:
    enabled: true

  # Уведомления: Claude Code закончил работу или ждёт ответа
  notifier:
    enabled: true
    sound: true
    desktop: true
    # Клик по уведомлению переводит фокус на окно терминала (KDE Plasma, X11 и Wayland)
    activate_on_click: true

# Ключи задач для chooks style: префиксы проектов (--keys их заменяет) и адрес
# задачи без ключа для этих префиксов — черновик получает голый URL задачи.
# Без префиксов ключ в черновике не ищется
# style:
#   key_prefixes: [PROJ]
#   issue_url: https://jira.example/browse/

# Демон хуков chooks serve и прокси chooks-hook: больше fallback_alert вызовов
# за скользящий час, исполненных CLI мимо демона (демон остановлен, убит,
# завис или отказал), — одно уведомление на рабочий стол с причинами, не чаще
# раза в час. Считает CLI запасного пути, не демон. 0 — 10, отрицательное —
# без уведомления
daemon:
  fallback_alert: 10
